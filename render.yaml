services:
  - type: web
    name: kelajak-markazi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: ACCESS_TOKEN_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: https://kelajak-markazi1.netlify.app
      - key: SITE_URL
        value: https://kelajak-markazi1.netlify.app
